<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Green Notepad · Mobile Dynamic</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="note-style.css">
</head>
<body>
  <div class="app" id="app">
    <!-- HEADER -->
    <div class="app-header">
      <div class="header-top">
        <div class="logo">
          <i class="fas fa-leaf"></i>
          <span>Green Note</span>
        </div>
        <div class="stats">
          <span><i id="noteCount">0</i> notes</span>
          <span><i id="filteredCount">0</i> shown</span>
        </div>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <button class="tool-btn success" id="newNoteBtn">
        <i class="fas fa-plus"></i> New
      </button>
      <button class="tool-btn" id="clearAllBtn">
        <i class="fas fa-broom"></i> Clear
      </button>
      <button class="tool-btn danger" id="deleteLastBtn">
        <i class="fas fa-trash-alt"></i> Last
      </button>
      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Search notes..." autocomplete="off">
        <button id="clearSearchBtn"><i class="fas fa-times"></i></button>
      </div>
    </div>

    <!-- NOTES CONTAINER -->
    <div class="notes-container" id="notesContainer"></div>

    <!-- FLOATING ACTION BUTTON -->
    <div class="fab" id="fabNewNote">
      <i class="fas fa-pen"></i>
    </div>
  </div>

  <!-- MODAL FOR NEW NOTE -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <h3>New Note</h3>
      <input type="text" id="modalTitle" placeholder="Title" value="🌿 New note">
      <textarea id="modalContent" rows="3" placeholder="Write something green...">Write something green...</textarea>
      <div class="modal-actions">
        <button class="cancel" id="modalCancel">Cancel</button>
        <button class="save" id="modalSave">Save</button>
      </div>
    </div>
  </div>

  <script src="note-script.js"></script>
</body>
</html>
